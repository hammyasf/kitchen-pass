<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Pass</title>
<meta name="description" content="Every dish hot at the same minute. Kitchen Pass works your dinner backwards from serve time and calls each step out like a restaurant pass.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317191c'/%3E%3Cpath d='M14 44h36a18 18 0 0 0-36 0z' fill='%23d9dde1'/%3E%3Crect x='10' y='45' width='44' height='6' rx='2' fill='%23ffb15c'/%3E%3Crect x='29' y='18' width='6' height='8' rx='2' fill='%23d9dde1'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#141619; --panel:#1c1f23; --panel-2:#23272c; --line:#33383f; --text:#ece8df; --muted:#9aa0a7;
  --paper:#f6f2e7; --paper-2:#ebe5d5; --ink:#1e1c19; --ink-2:#5b5650; --red:#c43a24; --amber:#ffb15c; --stove:#5d8fbf; --counter:#8a8f96;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --sans:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:#111316}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;font-size:17px;margin-right:auto}
.brand svg{width:30px;height:30px}
.field{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.field input,.field select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--text)}
.field input[type=time]{font-family:var(--mono);font-size:15px;color-scheme:dark}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-size:14px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:#2c3137;border-color:#454b53}
.btn:active{transform:translateY(1px)}
.btn.hot{background:var(--amber);border-color:var(--amber);color:#1a1307;font-weight:650}
.btn.hot:hover{background:#ffc07a}
.btn.on{border-color:var(--amber);color:var(--amber)}
.btn svg{width:16px;height:16px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel-2);border:0;padding:7px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#343a41;color:var(--text)}

/* the pass */
.pass{position:relative;padding:22px 20px 0;background:linear-gradient(#0e0f11,#191b1f 70%,var(--bg));overflow:hidden}
.lamps{position:absolute;inset:0 0 auto 0;height:180px;pointer-events:none;display:flex;justify-content:space-around}
.lamps i{width:34%;height:190px;background:radial-gradient(ellipse at 50% 0,rgba(255,170,80,.30),rgba(255,140,50,.10) 45%,transparent 70%);animation:hum 5s ease-in-out infinite}
.lamps i:nth-child(2){animation-delay:-1.7s}.lamps i:nth-child(3){animation-delay:-3.1s}
@keyframes hum{50%{opacity:.82}}
.status{position:relative;display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:16px}
.clock{font:600 46px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{display:block;font:500 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mode{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;border-radius:5px;background:#2a2e34;color:var(--muted);vertical-align:middle;margin-left:10px}
.mode.live{background:rgba(196,58,36,.18);color:#ff8a72}
.mode.rehearse{background:rgba(255,177,92,.15);color:var(--amber)}
.next{flex:1;min-width:240px}
.next small{display:block;font:500 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
#nextTxt{font-size:24px;font-weight:650;letter-spacing:-.01em}
#nextIn{font:600 24px var(--mono);color:var(--amber);margin-left:10px;font-variant-numeric:tabular-nums}
.progress{height:3px;background:#2a2e34;border-radius:2px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--amber);transition:width .25s linear}
.cooking{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:0}
[data-run=live] .cooking,[data-run=rehearse] .cooking{min-height:29px}
.pill{display:inline-flex;align-items:center;gap:7px;background:#23272c;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 9px;font-size:13px;white-space:nowrap;animation:pop .3s cubic-bezier(.3,1.4,.5,1) both}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 currentColor;animation:glow 1.6s ease-out infinite;color:rgba(255,177,92,.5)}
.pill.stove i{background:var(--stove);color:rgba(93,143,191,.5)}
.pill.counter i,.pill.rest i,.pill.hold i{background:var(--counter);color:transparent;animation:none}
.pill em{font-style:normal;color:var(--muted)}
.pill b{font:600 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--amber)}
.pill.rest b,.pill.hold b{color:var(--muted)}
@keyframes glow{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.late{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-4px 0 14px;padding:10px 12px;border-radius:8px;background:rgba(196,58,36,.16);border:1px solid rgba(196,58,36,.5);color:#ffc2b5;font-size:14px}
.late[hidden]{display:none}
.late p{margin:0;flex:1;min-width:240px}
.late .btn{padding:6px 12px}

.shelf{position:relative;display:flex;gap:16px;align-items:flex-start}
.railwrap{flex:1;min-width:0;position:relative}
.rail{height:16px;border-radius:4px;background:linear-gradient(#eef1f3,#aab1b8 45%,#7e868e 55%,#c3c9ce);box-shadow:0 2px 0 #0008,inset 0 -1px 0 #fff4}
.chits{display:flex;gap:12px;padding:0 6px 26px;margin-top:-6px;overflow-x:auto;overflow-y:hidden;min-height:250px;scrollbar-width:thin}
.chit{position:relative;flex:none;width:184px;transform-origin:50% 0;animation:print .55s cubic-bezier(.2,.8,.2,1) both}
.chit .slip{position:relative;background:var(--paper);color:var(--ink);font:13px/1.35 var(--mono);padding:16px 13px 20px;
  box-shadow:0 10px 24px #0007;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 7px repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 7px repeat-x}
.chit .slip::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#0000000a 3px 4px);pointer-events:none}
.chit .clip{position:absolute;top:-4px;left:50%;width:46px;height:14px;margin-left:-23px;border-radius:3px;background:linear-gradient(#f3f5f6,#9aa2a9);box-shadow:0 2px 3px #0006;z-index:2}
.chit .hd{display:flex;justify-content:space-between;color:var(--ink-2);font-size:12px}
.chit .kind{font:800 30px/1.05 var(--mono);letter-spacing:-.02em;margin:8px 0 2px}
.chit .dish{font-weight:700;font-size:15px;text-transform:uppercase;line-height:1.2;min-height:2.4em}
.chit .det{color:var(--ink-2);font-size:12px;margin-top:4px;min-height:3em}
.chit .cut{border-top:1px dashed #0004;margin:10px 0 8px}
.chit .cd{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.chit .cd b{font-size:20px}
.chit[data-kind=fire] .kind,.chit[data-kind=serve] .kind{color:var(--red)}
.chit[data-kind=pull] .kind{color:#1f3f66}
.chit[data-kind=heat] .kind{color:#a35a10}
.chit.first .slip{box-shadow:0 0 0 2px var(--amber),0 14px 30px #000a}
.chit.due{animation:print .55s cubic-bezier(.2,.8,.2,1) both,swing 1.6s ease-in-out .55s infinite}
.chit.due .slip{background:#fff7da}
.chit .stamp{display:none;position:absolute;right:10px;top:46px;transform:rotate(-12deg);border:3px solid var(--red);color:var(--red);font:900 20px/1 var(--mono);padding:4px 7px;border-radius:5px;opacity:.88}
.chit.due .stamp{display:block;animation:stamp .3s cubic-bezier(.3,1.6,.5,1) both}
.chit .spk{visibility:hidden;display:block;margin-top:10px;width:100%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 12px var(--mono);letter-spacing:.08em;border-radius:5px;padding:6px}
.chit.due .spk{visibility:visible}
.chit .spk:hover{background:var(--ink);color:var(--paper)}
.chit.gone{animation:spiked .45s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-14px)}to{clip-path:inset(0 0 -40px 0);transform:none}}
@keyframes swing{0%,100%{rotate:0deg}25%{rotate:1.6deg}75%{rotate:-1.6deg}}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}}
@keyframes spiked{to{transform:translate(60vw,40px) rotate(18deg) scale(.4);opacity:0}}
.empty{color:var(--muted);padding:40px 10px;font-size:14px}

.spindle{flex:none;width:96px;text-align:center;padding-top:6px}
.spindle svg{width:70px;height:170px;display:block;margin:0 auto}
.spindle b{display:block;font:700 20px var(--mono)}
.spindle small{color:var(--muted);font-size:12px}

/* work area */
.work{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;padding:18px 20px 30px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:13px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.card h2 .sp{margin-left:auto}
.dishes{display:grid;gap:8px}
.dish{display:grid;grid-template-columns:minmax(90px,1.6fr) 84px 58px 62px 50px 50px 104px 24px;gap:6px;align-items:center}
.dish.head{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dish input,.dish select{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:14px}
.dish input.num{font-family:var(--mono);text-align:right}
.dish input:disabled{opacity:.35}
.dish input.bad{border-color:var(--red)}
.dish .x{background:none;border:0;color:var(--muted);font-size:18px;padding:4px}
.dish .x:hover{color:var(--red)}
.dish .f{display:block;min-width:0}
.dish .f>span:first-child{display:none;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 3px 2px}
.chk{display:flex;gap:4px}
.chk input[data-k=check]:placeholder-shown+input{opacity:.4}
.title{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 2px 8px;margin:0 0 12px;font-size:19px;font-weight:650;color:var(--text)}
.title:focus{border-bottom-color:var(--amber);outline:0}
.title::placeholder{color:#5f656c}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{color:var(--muted);font-size:12.5px;margin-top:10px}

.clash{border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;display:none}
.clash.bad{display:block;background:rgba(196,58,36,.14);border:1px solid rgba(196,58,36,.45);color:#ffb3a4}
.clash.fixed{display:block;background:rgba(120,190,120,.10);border:1px solid rgba(120,190,120,.35);color:#bfe3bf}
.clash ul{margin:6px 0 0;padding-left:18px}
#gantt{width:100%;height:auto;display:block}
#gantt text{font:11px var(--sans);fill:var(--muted)}
#gantt .lbl{fill:var(--text);font-size:12px}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--amber);width:16px;height:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--paper);color:var(--ink);font:600 14px var(--sans);padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px #000a;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{margin-left:12px;background:var(--ink);color:var(--paper);border:0;border-radius:5px;padding:4px 10px;font:700 13px var(--sans)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1240px){.work{grid-template-columns:1fr}}
@media (max-width:860px){
  .top{gap:8px;padding:10px 14px}.btn .t{display:none}.btn{padding:8px 10px}.btn.hot .t{display:inline}
  .pass{padding:16px 14px 0}.work{padding:14px}.clock{font-size:36px}
  .spindle{display:none}
  .dish{grid-template-columns:repeat(3,minmax(0,1fr));padding-bottom:10px;border-bottom:1px solid var(--line)}
  .dish.head{display:none}
  .dish .f>span:first-child{display:block}
  .dish{position:relative}
  .dish .f:first-child{grid-column:1/3}
  .dish .f:nth-child(7){grid-column:2/4}
  .dish .x{position:absolute;top:-6px;right:-4px}
  .dish .x{justify-self:end}
  #speed{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 44h36a18 18 0 0 0-36 0z" fill="#d9dde1"/><path d="M20 42a12 12 0 0 1 8-11" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/><rect x="10" y="45" width="44" height="6" rx="2" fill="#ffb15c"/><rect x="29" y="18" width="6" height="8" rx="2" fill="#d9dde1"/></svg>
    Kitchen Pass
  </div>
  <label class="field">Serve at <input type="time" id="serve" value="17:00" step="300"></label>
  <label class="field"><span class="sr">Rehearsal speed</span>
    <select id="speed" aria-label="Rehearsal speed"><option value="120">×120</option><option value="240" selected>×240</option><option value="600">×600</option></select>
  </label>
  <button class="btn" id="rehearse"><svg viewBox="0 0 16 16"><path d="M3 2l5 6-5 6zM9 2l5 6-5 6z" fill="currentColor"/></svg><span class="t">Rehearse</span></button>
  <button class="btn hot" id="live"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="currentColor"/></svg><span class="t">Start service</span></button>
  <button class="btn on" id="sound" aria-pressed="true" title="Bell and call-outs"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg><span class="t">Sound</span></button>
  <button class="btn" id="share"><svg viewBox="0 0 16 16"><path d="M6.5 9.5l3-3M5 7L3.6 8.4a2.5 2.5 0 0 0 3.5 3.5L8.5 10.5M11 9l1.4-1.4a2.5 2.5 0 0 0-3.5-3.5L7.5 5.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span class="t">Share</span></button>
  <button class="btn" id="ticket"><svg viewBox="0 0 16 16"><path d="M3 1h10v13l-1.7-1-1.6 1-1.7-1-1.6 1-1.7-1L3 14z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 5h5M5.5 8h5" stroke="currentColor" stroke-width="1.5"/></svg><span class="t">Ticket</span></button>
</header>

<section class="pass" aria-label="The pass">
  <div class="lamps" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="status">
    <div class="clock"><small>Kitchen time <span class="mode" id="mode">Plan</span></small><span id="clock">--:--</span></div>
    <div class="next" aria-live="polite"><small>Next call</small><b id="nextTxt">—</b><span id="nextIn"></span>
      <div class="progress"><i id="prog"></i></div><div class="cooking" id="cooking" aria-label="On the heat now"></div></div>
  </div>
  <div class="late" id="late" role="alert" hidden></div>
  <div class="shelf">
    <div class="railwrap">
      <div class="rail" aria-hidden="true"></div>
      <div class="chits" id="chits"></div>
    </div>
    <div class="spindle" aria-label="Done tickets">
      <svg viewBox="0 0 70 170" aria-hidden="true"><rect x="8" y="152" width="54" height="12" rx="3" fill="#7e868e"/><rect x="33.5" y="10" width="3" height="146" fill="#c3c9ce"/><path d="M35 2l3 10h-6z" fill="#c3c9ce"/><g id="pile"></g></svg>
      <b id="spikeN">0</b><small>done</small>
    </div>
  </div>
</section>

<main class="work">
  <section class="card" aria-labelledby="menuH">
    <h2 id="menuH">Menu
      <select id="preset" class="sp" aria-label="Load a menu" style="background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;letter-spacing:0;text-transform:none;color:var(--text)">
        <option value="">Load a menu…</option><option value="thanksgiving">Thanksgiving for 8</option><option value="roast">Sunday roast</option><option value="weeknight">Weeknight pasta</option><option value="empty">Start empty</option>
      </select>
    </h2>
    <input class="title" id="title" maxlength="40" placeholder="Name this dinner" aria-label="Dinner name">
    <div class="dishes" id="dishes"></div>
    <div class="addrow"><button class="btn" id="add">+ Add dish</button>
      <label class="field">Ovens <select id="ovens"><option>1</option><option>2</option></select></label>
      <div class="seg" role="group" aria-label="Temperature unit"><button id="uF" aria-pressed="true">°F</button><button id="uC" aria-pressed="false">°C</button></div></div>
    <p class="hint">Times take <b>3h30</b>, <b>3:30</b> or <b>210</b>. Rest is time out of the heat before serving. Check repeats a reminder (baste, stir) every so many minutes. In service, <b>space</b> spikes the called ticket; <b>R</b> rehearses. Your menu stays in this browser.</p>
  </section>
  <section class="card" aria-labelledby="lineH">
    <h2 id="lineH">The line <label class="toggle sp"><input type="checkbox" id="solve" checked> Solve oven clashes</label></h2>
    <div class="clash" id="clash" role="status"></div>
    <svg id="gantt" role="img" aria-label="Timeline of every dish"></svg>
    <div class="legend" id="legend"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>/*CORE*/</script>
<script>
(() => {
const C = window.KPCore, MIN = C.MIN, $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// ---------- state ----------
const S = { title: '', dishes: [], serve: '17:00', unit: 'F', ovens: 1, solve: true, sound: true, run: 'plan', sim: null, fired: new Set(), spiked: new Set(), sched: null };
function loadMenu(m) { S.title = m.title || ''; S.serve = m.serve; S.dishes = m.dishes.map(C.clean); }
const fromHash = location.hash.startsWith('#m=') && C.decodeMenu(location.hash.slice(3));
let saved = null; try { saved = JSON.parse(store.get('kp.menu') || 'null'); } catch {}
loadMenu(fromHash || (saved && saved.dishes ? saved : C.PRESETS.thanksgiving));
S.unit = store.get('kp.unit') === 'C' ? 'C' : 'F';
const save = () => store.set('kp.menu', JSON.stringify({ title: S.title, serve: S.serve, dishes: S.dishes }));

// ---------- clock ----------
function now() { return S.sim ? S.sim.t0 + (performance.now() - S.sim.p0) * S.sim.speed : Date.now(); }
function serveMs() {
  // in plan mode the board shows the dinner as if it starts now
  if (S.sim) return S.sim.serve;
  return C.serveAt(S.serve, Date.now());
}
const T = f => C.fmtTemp(f, S.unit);
const unitText = s => S.unit === 'C' ? s.replace(/(\d+)°F/g, (m, f) => C.toC(+f) + '°C').replace(/(\d+)° (hotter|cooler)/, (m, d, w) => Math.round(d * 5 / 9) + '° ' + w) : s;

// ---------- audio ----------
let ac = null;
const audio = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
function bell(at = 0) {
  const a = audio(); if (!a || !S.sound) return; const t = a.currentTime + at, out = a.createGain(); out.gain.value = .32; out.connect(a.destination);

    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch?.(() => {});
  } else if (wake) { wake.release().catch(() => {}); wake = null; }
  $('#mode').textContent = { plan: 'Plan', live: 'Live', rehearse: 'Rehearsal ×' + $('#speed').value }[mode];
  $('#mode').className = 'mode ' + mode;
  document.body.dataset.run = mode;
  $('#live').innerHTML = mode === 'live' ? '<svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" fill="currentColor"/></svg><span class="t">Stop service</span>' : '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="currentColor"/></svg><span class="t">Start service</span>';
  $('#rehearse').classList.toggle('on', mode === 'rehearse');
  renderAll(true);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.run === 'live' && navigator.wakeLock) navigator.wakeLock.request('screen').then(w => wake = w).catch(() => {}); });

// live service: calls well in the past are done (the late banner names them); a call from the last 2 min still rings
function skipPast() { const n = now(); S.sched.events.filter(e => e.t <= n - SKIP).forEach(e => { S.fired.add(e.key); S.spiked.add(e.key); }); }
function renderAll(quiet) { renderGantt(); renderClash(); renderLate(); renderPass(quiet); }
function changed(rebuildMenu) {
  save(); if (rebuildMenu) renderMenu();
  if (S.run === 'rehearse') { setRun('rehearse'); return; }
  compute(); if (S.run === 'live') skipPast();
  chitsEl.innerHTML = ''; shown.clear(); renderAll(true);
}
setInterval(() => {
  if (S.run === 'rehearse' && now() > S.sched.serve + 3 * MIN) { S.sim.speed = 0; S.sim.t0 = S.sched.serve + 3 * MIN; S.sim.p0 = performance.now(); }
  fire(); tickPass();
}, 200);

// ---------- share + ticket ----------
function toast(t, label, act) {
  const el = $('#toast'); el.textContent = t;
  if (label) { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = () => { el.classList.remove('show'); act(); }; el.appendChild(b); }
  el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), label ? 5000 : 2400);
}
$('#share').onclick = async () => {
  const url = location.href.split('#')[0] + '#m=' + C.encodeMenu({ serve: S.serve, title: S.title, dishes: S.dishes });
  history.replaceState(null, '', url);
  try { await navigator.clipboard.writeText(url); toast('Link copied. It opens this exact menu.'); } catch { prompt('Copy this link', url); }
};
function ticketCanvas() {
  const s = S.sched, w = 576, pad = 30, lh = 30, ev = s.events, f24 = S.unit === 'C';
  const lines = [];
  ev.forEach(e => { const p = chitParts(e); lines.push([C.clock(e.t, f24), p.kind, p.dish + (e.kind === 'fire' ? ' · ' + p.det.split(' · ')[0] : '')]); });
  const cv = document.createElement('canvas'), h = 330 + lines.length * lh + 150; cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); const mono = '"SF Mono",Menlo,Consolas,monospace';
  g.fillStyle = '#f6f2e7'; g.fillRect(0, 0, w, h - 14);
  g.beginPath(); g.moveTo(0, h - 14); for (let x = 0; x <= w; x += 16) { g.lineTo(x + 8, h); g.lineTo(x + 16, h - 14); } g.fill();
  g.fillStyle = '#1e1c19'; g.textAlign = 'center';
  g.font = `800 34px ${mono}`; g.fillText('KITCHEN PASS', w / 2, 66);
  g.font = `500 20px ${mono}`; g.fillText((S.title || 'Dinner').toUpperCase().slice(0, 32), w / 2, 102);
  g.fillText(new Date(s.serve).toDateString().toUpperCase(), w / 2, 132);
  g.font = `800 44px ${mono}`; g.fillStyle = '#c43a24'; g.fillText('SERVE ' + C.clock(s.serve, f24), w / 2, 196);
  g.fillStyle = '#1e1c19'; g.font = `500 18px ${mono}`; g.fillText(`${S.dishes.length} dishes · ${ev.length} calls · ${C.fmtDur((s.serve - s.start) / MIN)}`, w / 2, 232);
  const dash = y => { g.save(); g.setLineDash([8, 6]); g.strokeStyle = '#1e1c1966'; g.beginPath(); g.moveTo(pad, y); g.lineTo(w - pad, y); g.stroke(); g.restore(); };
  dash(260); g.textAlign = 'left';
  lines.forEach(([t, k, d], i) => {
    const y = 300 + i * lh; g.font = `500 19px ${mono}`; g.fillStyle = '#5b5650'; g.fillText(t.padStart(8), pad, y);
    g.font = `800 19px ${mono}`; g.fillStyle = /FIRE|SERVE/.test(k) ? '#c43a24' : '#1e1c19'; g.fillText(k.slice(0, 6), pad + 118, y);
    g.font = `500 19px ${mono}`; g.fillStyle = '#1e1c19'; let txt = d; while (g.measureText(txt).width > w - pad * 2 - 200) txt = txt.slice(0, -2) + '…'; g.fillText(txt, pad + 200, y);
  });
  const yb = 300 + lines.length * lh; dash(yb - 6); g.textAlign = 'center'; g.font = `500 18px ${mono}`;
  const raw = S.solve ? C.schedule(S.dishes, s.serve, { ovens: S.ovens }).clashes.length : 0, fixes = s.items.filter(i => i.moved || i.hold).length;
  g.fillText(s.clashes.length ? `OVEN CLASH LEFT: FIX IT` : raw ? `OVEN CLASH SOLVED: ${fixes} CHANGE${fixes > 1 ? 'S' : ''}` : 'NO OVEN CLASHES', w / 2, yb + 34);
  g.fillText('EVERY DISH HOT AT THE SAME MINUTE', w / 2, yb + 66);
  g.font = `700 18px ${mono}`; g.fillText('kitchen-pass.codepost.dev', w / 2, yb + 100);
  return cv;
}
$('#ticket').onclick = () => {
  printer(); const cv = ticketCanvas();
  cv.toBlob(async b => {
    const file = new File([b], 'kitchen-pass-ticket.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia('(pointer:coarse)').matches) { try { await navigator.share({ files: [file], title: 'Kitchen Pass' }); return; } catch {} }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'kitchen-pass-ticket.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Ticket saved as a PNG.');
  }, 'image/png');
};

// ---------- controls ----------
$('#serve').value = S.serve;
$('#serve').onchange = e => { if (e.target.value) { S.serve = e.target.value; changed(); } };
$('#rehearse').onclick = () => { audio(); setRun(S.run === 'rehearse' ? 'plan' : 'rehearse'); };
$('#live').onclick = () => { audio(); setRun(S.run === 'live' ? 'plan' : 'live'); };
$('#speed').onchange = () => S.run === 'rehearse' && setRun('rehearse');
$('#sound').onclick = e => { S.sound = !S.sound; const b = $('#sound'); b.classList.toggle('on', S.sound); b.setAttribute('aria-pressed', S.sound); if (S.sound) { audio(); bell(); } };
$('#solve').onchange = e => { S.solve = e.target.checked; changed(); };
$('#ovens').onchange = e => { S.ovens = +e.target.value; changed(); };
$('#add').onclick = () => { S.dishes.push(C.clean({ name: 'New dish', where: 'oven', temp: 350, cook: 30 })); changed(true); dishesEl.lastElementChild.querySelector('input').select(); };
$('#preset').onchange = e => { const v = e.target.value; if (!v) return; loadMenu(v === 'empty' ? { title: '', serve: S.serve, dishes: [] } : C.PRESETS[v]); $('#serve').value = S.serve; $('#title').value = S.title; e.target.value = ''; changed(true); };
$('#title').value = S.title;
$('#title').onchange = e => { S.title = e.target.value.trim().slice(0, 40); changed(); };
const setUnit = u => { S.unit = u; store.set('kp.unit', u); $('#uF').setAttribute('aria-pressed', u === 'F'); $('#uC').setAttribute('aria-pressed', u === 'C'); renderMenu(); chitsEl.innerHTML = ''; shown.clear(); renderAll(true); };
$('#uF').onclick = () => setUnit('F'); $('#uC').onclick = () => setUnit('C');
document.addEventListener('keydown', e => {
  if (e.target.closest('input,select,textarea')) return;
  if (e.key === ' ') { const d = S.sched.events.find(x => S.fired.has(x.key) && !S.spiked.has(x.key)); if (d) { e.preventDefault(); spike(d.key); } }
  if (e.key === 'r') $('#rehearse').click();
});

// test hook (selftests and the demo video drive the real app through this)
window.__kp = { C, S, setRun, compute, renderAll, ticketCanvas, now, jump(t) { if (S.sim) { S.sim.t0 = t; S.sim.p0 = performance.now(); } } };

compute(); setUnit(S.unit);
})();
</script>
